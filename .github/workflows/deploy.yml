name: Deploy

on:
  workflow_dispatch:
    inputs:
      stage:
        description: SST stage
        required: true
        type: choice
        options:
          - dev
          - staging
          - production
        default: dev
  push:
    branches: [main]
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "astro.config.*"
      - "tsconfig.json"
      - "sst.config.ts"
      - "infra/**"
      - "bin/deploy/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy.yml"

# Push to main deploys dev only when AWS_DEPLOY_ENABLED=true.
# workflow_dispatch can deploy dev, staging, or production.
# Each stage is a GitHub Environment. Environment secrets override
# repository secrets of the same name.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.AWS_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      id-token: write
      contents: read
    env:
      STAGE: ${{ github.event_name == 'workflow_dispatch' && inputs.stage || 'dev' }}
      ASTRO_TELEMETRY_DISABLED: "1"
      SST_TELEMETRY_DISABLED: "1"
      SITE_DOMAIN: ${{ vars.SITE_DOMAIN }}
      SITE_DOMAIN_REDIRECTS: ${{ vars.SITE_DOMAIN_REDIRECTS }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-central-1
      - name: Deploy the stage
        id: deploy
        run: |
          bash bin/deploy/deploy.sh "$STAGE"
          url="$(node -e "process.stdout.write(require('./.sst/outputs.json').url ?? '')")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Stage \`$STAGE\`: $url" >> "$GITHUB_STEP_SUMMARY"
