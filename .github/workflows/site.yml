name: Site

on:
  pull_request:
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "astro.config.*"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  push:
    branches: [main, staging]
    paths:
      - "src/**"
      - "content/**"
      - "public/**"
      - "astro.config.*"
      - "tsconfig.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/site.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      # --if-present: the Astro project (check, build) arrives in phase 1.
      - run: npm run check --if-present
      - run: npm run build --if-present
