name: Infra

on:
  pull_request:
    paths:
      - "sst.config.ts"
      - "infra/**"
      - "bin/deploy/**"
      - "scripts/**"
      - "content/redirects.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/infra.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check shell scripts
        run: |
          bash -n bin/deploy/deploy.sh
          bash -n scripts/check-infra.sh
      - name: Check the stack, edge code, and redirects
        run: npm run typecheck:infra
